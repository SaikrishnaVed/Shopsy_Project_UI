<div class="reset-password-container">
    <mat-card class="reset-password-card">
      <mat-card-header>
        <mat-card-title>Reset Password</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <form #resetForm="ngForm" (ngSubmit)="onResetPassword(resetForm)">
          <mat-form-field class="full-width">
            <mat-label>New Password</mat-label>
            <input
              matInput
              type="password"
              name="newPassword"
              [(ngModel)]="newPassword"
              required
            />
          </mat-form-field>
  
          <mat-form-field class="full-width">
            <mat-label>Confirm Password</mat-label>
            <input
              matInput
              type="password"
              name="confirmPassword"
              [(ngModel)]="confirmPassword"
              required
            />
          </mat-form-field>
  
          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="!resetForm.valid || newPassword !== confirmPassword"
            class="submit-button"
          >
            Reset Password
          </button>
        </form>
      </mat-card-content>
    </mat-card>
  </div>
