<h1 mat-dialog-title>Products Preview</h1>
<div mat-dialog-content>
  <div class="scroll-container">
    <table mat-table [dataSource]="data" class="mat-elevation-z8">
      <ng-container matColumnDef="product_Name">
        <th mat-header-cell *matHeaderCellDef> Name </th>
        <td mat-cell *matCellDef="let element"> {{ element.product_Name }} </td>
      </ng-container>

      <ng-container matColumnDef="list_Price">
        <th mat-header-cell *matHeaderCellDef> Price </th>
        <td mat-cell *matCellDef="let element"> {{ element.list_Price }} </td>
      </ng-container>

      <ng-container matColumnDef="quantity">
        <th mat-header-cell *matHeaderCellDef> Quantity </th>
        <td mat-cell *matCellDef="let element"> {{ element.quantity }} </td>
      </ng-container>

      <ng-container matColumnDef="color">
        <th mat-header-cell *matHeaderCellDef> Color </th>
        <td mat-cell *matCellDef="let element"> {{ element.color }} </td>
      </ng-container>

      <ng-container matColumnDef="model_Year">
        <th mat-header-cell *matHeaderCellDef> Model Year </th>
        <td mat-cell *matCellDef="let element"> {{ element.model_Year }} </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="['product_Name', 'list_Price', 'quantity', 'color', 'model_Year']"></tr>
      <tr mat-row *matRowDef="let row; columns: ['product_Name', 'list_Price', 'quantity', 'color', 'model_Year']"></tr>
    </table>
  </div>
</div>
<div mat-dialog-actions>
  <button mat-button (click)="onClose()">Close</button>
</div>
