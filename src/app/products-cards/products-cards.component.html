<div *ngIf="isLoading" class="spinner-container">
  <mat-spinner></mat-spinner>
</div>
<div *ngIf="!isLoading" class="filter-container">
  <div class="dropdown">
    <button class="filter-btn"> <i class="fas fa-filter"></i> Price Range</button>
    <div class="dropdown-content">
      <label>
        <input type="checkbox" (change)="togglePriceRange('0-500')" /> ₹0 - ₹500
      </label>
      <label>
        <input type="checkbox" (change)="togglePriceRange('500-1000')" /> ₹500 - ₹1000
      </label>
      <label>
        <input type="checkbox" (change)="togglePriceRange('1000-2000')" /> ₹1000 - ₹2000
      </label>
      <label>
        <input type="checkbox" (change)="togglePriceRange('2000-5000')" /> ₹2000 - ₹5000
      </label>
      <label>
        <input type="checkbox" (change)="togglePriceRange('5000-10000')" /> ₹5000 - ₹10000
      </label>
    </div>
  </div>
</div>



<div *ngIf="!isLoading" class="product-grid">
  <div class="product-card" (dblclick)="productPage(item.product_Id)" *ngFor="let item of filteredProductList">
    <img [src]="item.imagePath" [alt]="item.product_name" class="product-image" />
    <div class="product-details">
      <h3 class="product-name">{{ item.product_Name }}</h3>
      <p class="product-price">Price: ₹ {{ item.list_Price }}</p>
      <p class="product-quantity">Stock: {{ item.quantity }}</p>
      <p class="product-color">Color: {{ item.color }}</p>
      <p class="product-year">Model Year: {{ item.model_Year }}</p>
    </div>

    <button mat-icon-button (click)="toggleWishlist(item)">
      <mat-icon [color]="item.isfavourite ? 'warn' : ''">
        {{ item.isfavourite ? 'favorite' : 'favorite_border' }}
      </mat-icon>
    </button>

    <div *ngIf="item.cartcount === 0">
      <button mat-raised-button color="primary" class="add-to-cart-button" (click)="addToCart(item)">
        Add to Cart
      </button>
    </div>

    <div *ngIf="item.cartcount > 0" class="cart-controls">
      <button mat-button (click)="decrementCount(item)">-</button>
      <span>{{ item.cartcount }}</span>
      <button mat-button (click)="incrementCount(item)">+</button>
    </div>
  </div>
</div>
